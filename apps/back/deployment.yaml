apiVersion: apps/v1
kind: Deployment
metadata:
  name: back
spec:
  replicas: 1
  selector:
    matchLabels: { app: back }
  template:
    metadata:
      labels: { app: back }
    spec:
      containers:
      - name: back
        image: ghcr.io/traefik/whoami:latest
        args: ["--port=8080"]           # 👈 écoute sur 8080 (non-root OK)
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
